services:
  web:
    image: node:22-slim
    working_dir: /app
    # Bind-mount the cloned source so edits are reflected live.
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    ports:
      - "3000:8080"
    environment:
      # The Lovable TanStack config hard-forces the Vite dev server to port 8080
      # with strictPort, so we expose host 3000 -> container 8080.
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX:-}
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm dev"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

volumes:
  node_modules:
